<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH ENGLISH - 캘린더</title>

    <!-- 오늘 날짜의 연도 캘린더로 즉시 리다이렉트 (JS 비활성 시 2026 폴백) -->
    <meta http-equiv="refresh" content="0; url=https://calendar.zenith-english.co.kr/2026/index.html">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Noto Sans KR', sans-serif;
            color: #fff;
            text-align: center;
            padding: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .brand {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 28px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 24px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .link {
            display: inline-block;
            margin-top: 20px;
            color: #fff;
            font-weight: 500;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            padding-bottom: 2px;
        }

        .link:hover { opacity: 0.8; }
    </style>

    <script>
        // 오늘 날짜의 연도에 맞춰 해당 연도 캘린더로 이동
        var year = new Date().getFullYear();
        var target = "https://calendar.zenith-english.co.kr/" + year + "/index.html";
        // 수동 링크도 같은 주소로 맞춰줌
        document.addEventListener("DOMContentLoaded", function () {
            var link = document.getElementById("go-link");
            if (link) {
                link.href = target;
                link.textContent = year + " 캘린더 바로 가기 →";
            }
            var msg = document.getElementById("go-msg");
            if (msg) msg.textContent = year + " 캘린더로 이동 중입니다...";
        });
        window.location.replace(target);
    </script>
</head>
<body>
    <div class="card">
        <div class="brand">ZENITH ENGLISH</div>
        <div class="subtitle">✨ Excellence in English Education ✨</div>
        <div class="spinner"></div>
        <p class="message" id="go-msg">캘린더로 이동 중입니다...</p>
        <a class="link" id="go-link" href="https://calendar.zenith-english.co.kr/2026/index.html">바로 가기 →</a>
    </div>
</body>
</html>
